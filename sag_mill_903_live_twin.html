<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAG Mill 800-ML-903 Live Twin</title>
<style>
:root{
  --bg:#0C1317; --pan:#111A20; --pan2:#16222A; --line:#2A3B46; --line2:#1D2B34;
  --ink:#E6EEF2; --ink2:#8FA6B2; --ink3:#5E7683;
  --oil:#E8A33C; --oilr:#8A6425; --cw:#3FB8DC; --pulp:#B08968; --pwr:#FF4D57;
  --ok:#35C08A; --wa:#F2B33D; --al:#FF4D57;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"ABBvoice","Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.sheet{height:100%;padding:8px;display:flex;flex-direction:column;overflow:hidden}
.frame{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--pan);
  border:1px solid var(--line)}
.mast{flex:none;display:flex;justify-content:space-between;align-items:flex-end;
  padding:9px 14px 8px;border-bottom:1px solid var(--line)}
.mast h1{margin:0;font-size:16px;font-weight:700}
.mast .sub{font-size:10.5px;color:var(--ink2);margin-top:2px}
.mast .rt{text-align:right;font:600 9px/1.5 "Consolas",ui-monospace,monospace;
  color:var(--ink3);letter-spacing:.09em}

.tbar{flex:none;display:flex;align-items:center;gap:10px;padding:7px 14px;
  border-bottom:1px solid var(--line);background:var(--pan2)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{font:700 9.5px/1 inherit;letter-spacing:.08em;color:var(--ink2);background:transparent;
  border:0;padding:7px 11px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.tbtn{font:700 9.5px/1 inherit;letter-spacing:.06em;color:var(--ink);background:transparent;
  border:1px solid var(--line);padding:7px 10px;cursor:pointer;min-width:62px}
.tbtn:hover{border-color:var(--ink3)}
.tbtn.live{border-color:var(--ok);color:var(--ok)}
#scrub{flex:1;min-width:120px}
.clk{font:700 11px/1 "Consolas",ui-monospace,monospace;color:var(--ink);white-space:nowrap}
.clk small{color:var(--ink3);font-weight:400}

.body{flex:1;min-height:0;display:flex}
.draw{flex:1;min-width:0;min-height:0;border-right:1px solid var(--line)}
.draw svg{display:block;width:100%;height:100%}
.rail{width:296px;flex:none;min-height:0;display:flex;flex-direction:column;background:var(--pan2)}
.rail h2{margin:0;padding:7px 12px 6px;font:700 8.5px/1.4 "Consolas",ui-monospace,monospace;
  letter-spacing:.14em;color:var(--ink3);border-bottom:1px solid var(--line2)}
.scn{flex:none;padding:7px 9px;display:grid;grid-template-columns:1fr 1fr;gap:4px;
  border-bottom:1px solid var(--line2)}
.scn button{font:600 9.6px/1.2 inherit;color:var(--ink2);background:transparent;
  border:1px solid var(--line);padding:5px 6px;text-align:left;cursor:pointer}
.scn button:hover{border-color:var(--ink3);color:var(--ink)}
.scn button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scn button.wide{grid-column:1/-1}
.ctl{flex:1;min-height:0;overflow:auto;padding:8px 12px 10px}
.ctl.off{opacity:.3;pointer-events:none}
.row{margin-bottom:6px}
.row label{display:flex;justify-content:space-between;align-items:center;
  font-size:10.3px;color:var(--ink2);margin-bottom:3px}
.ent{display:inline-flex;align-items:center;gap:5px}
.num{width:62px;text-align:right;background:var(--pan);color:var(--ink);
  font:700 11px/1.3 "Consolas",ui-monospace,monospace;border:1px solid var(--line);padding:1px 3px}
.num:focus{outline:none;border-color:var(--ok)}
.num.bad{border-color:var(--al)}
.ent i{font-style:normal;font:600 9.3px/1 "Consolas",ui-monospace,monospace;
  color:var(--ink3);min-width:42px}
input[type=range]{width:100%;height:16px;-webkit-appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);margin-top:-4px;cursor:pointer}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--ink);border:0;cursor:pointer}
.seq{flex:none;border-top:1px solid var(--line2);padding:8px 12px 10px;max-height:150px;overflow:auto}
.seq ol{margin:0;padding-left:15px}
.seq li{font-size:10.2px;line-height:1.45;margin-bottom:3px;color:var(--ink2)}
.seq li b{color:var(--ink)}
.seq .none{font-size:10.3px;color:var(--ok)}
.fpiline{font-size:10.4px;margin-bottom:5px;color:var(--ink2)}

.kpis{flex:none;display:flex;border-top:1px solid var(--line)}
.kpi{flex:1;padding:6px 10px;border-right:1px solid var(--line2)}
.kpi:last-child{border-right:0}
.kpi .k{font:600 8.3px/1.4 "Consolas",ui-monospace,monospace;letter-spacing:.1em;color:var(--ink3)}
.kpi .v{font:700 17px/1.12 "Consolas",ui-monospace,monospace;margin-top:1px}
.kpi .u{font-size:9.5px;color:var(--ink3);font-weight:400}
.kpi.w .v{color:var(--wa)} .kpi.a .v{color:var(--al)}
.kpi.hero{background:#080D10;border-right:1px solid #2A3B46}.kpi.hero .v{color:var(--ok)}
.note{flex:none;border-top:1px solid var(--line);padding:7px 13px 8px;font-size:9px;
  line-height:1.45;color:var(--ink3);max-height:88px;overflow:auto}
.note b{color:var(--ink2)}
text{font-family:"Consolas",ui-monospace,monospace}
.lbl{font-family:"ABBvoice","Segoe UI",system-ui,Arial,sans-serif}
.anim{stroke-dasharray:9 7;animation:fl 1.1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-16}}
.stop{animation:none;stroke-dasharray:none}
@media (max-width:980px){.body{flex-direction:column}.rail{width:auto;border-top:1px solid var(--line)}
 .draw{border-right:0;min-height:380px}.kpi{min-width:33%}.kpis{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="sheet"><div class="frame">

<div class="mast">
  <div>
    <h1>SAG mill 800-ML-903 &mdash; live operational twin</h1>
    <div class="sub">EQI 214 &nbsp;&middot;&nbsp; EFM 17 &ldquo;SAG Mill 903 Integrated Diagnostic&rdquo; &nbsp;&middot;&nbsp; failure mode <i>Bearing Lubrication Failure</i> (1 of 3)</div>
  </div>
  <div class="rt">LIVE TWIN &nbsp;/&nbsp; DWG CA-SAG-GMD-DT-003<br>
    REV. C &nbsp;/&nbsp; EFM 17 TAGS &nbsp;/&nbsp; SIMULATOR REPLAY</div>
</div>

<div class="tbar">
  <div class="seg" id="mode">
    <button data-m="live" class="on">LIVE REPLAY</button>
    <button data-m="what">WHAT-IF</button>
  </div>
  <button class="tbtn live" id="play">&#9654; PLAY</button>
  <button class="tbtn" id="spd">10 min/s</button>
  <input type="range" id="scrub" min="0" max="8064" step="1" value="0">
  <div class="clk" id="clk"></div>
</div>

<div class="body">
  <div class="draw"><svg id="pid" viewBox="0 0 1420 660" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="rail">
    <h2>WHAT-IF SCENARIOS</h2>
    <div class="scn" id="scn"></div>
    <h2>INPUT VARIABLES</h2>
    <div class="ctl" id="ctl"></div>
    <h2>ORDER OF APPEARANCE</h2>
    <div class="seq" id="seq"></div>
  </div>
</div>

<div class="kpis" id="kpis"></div>
<div class="note" id="note"></div>
</div></div>
<script>
(function(){
"use strict";

/* ══════════ 1. ASSET ══════════ */
var G={ D:11.10,L:6.10,db:0.14,Pnom:19.4,Pdis:17.50,M0:900,rhoB:4.40,rhoR:1.75,
        nShoe:4,Ashoe:0.62,nHPdes:3 };
var Vm=Math.PI/4*G.D*G.D*G.L, Nc=42.3/Math.sqrt(G.D-G.db), Aj=G.nShoe*G.Ashoe;
var DES={Jc:0.26,Jb:0.14,phi:0.733};
function rhoC(a,b){var f=b/a;return f*G.rhoB+(1-f)*G.rhoR;}
function austin(a,b,p){var r=rhoC(a,b);
  return Math.pow(G.D,2.5)*G.L*r*a*(1-0.937*a)*p*(1-0.1/Math.pow(2,9-10*p));}
var K=G.Pdis/austin(DES.Jc,DES.Jb,DES.phi);

/* ══════════ 2. EFM 17 TAGS — real scales and thresholds ══════════ */
/* hi = healthy value, al = alarm value, w = KDI weight, cfg = configured in EFM 17 */
var TAGS=[
 {id:"ZI9376",t:"800-ZI-9376",d:"Oil film, discharge trunnion",u:"mm", dec:3,hi:0.170,al:0.080,w:10,cfg:1},
 {id:"TI9375",t:"800-TI-9375",d:"Discharge shoe temperature", u:"°C",dec:1,hi:53.0, al:82.0, w:7, cfg:1},
 {id:"AI9383",t:"800-AI-9383",d:"Oil cleanliness ISO 4406",   u:"code",dec:1,hi:16.0, al:23.0, w:7, cfg:1},
 {id:"PI9374",t:"800-PI-9374",d:"Discharge shoe pressure",    u:"kPa",dec:0,hi:18200,al:14500,w:6, cfg:1},
 {id:"PI9380",t:"800-PI-9380",d:"Lube supply pressure",       u:"kPa",dec:0,hi:560,  al:400,  w:5, cfg:1},
 {id:"PI9384",t:"800-PI-9384",d:"Filter ΔP",             u:"kPa",dec:0,hi:60,   al:180,  w:5, cfg:1},
 {id:"ZI9373",t:"800-ZI-9373",d:"Oil film, feed trunnion",    u:"mm", dec:3,hi:0.180,al:0.080,w:2, cfg:1},
 {id:"LI9382",t:"800-LI-9382",d:"Reservoir level",            u:"%",  dec:0,hi:78,   al:30,   w:2, cfg:1},
 {id:"TI9372",t:"800-TI-9372",d:"Feed shoe temperature",      u:"°C",dec:1,hi:52.0, al:82.0, w:1, cfg:1},
 {id:"TI9381",t:"800-TI-9381",d:"Oil temperature",            u:"°C",dec:1,hi:44.0, al:59.0, w:1, cfg:1},
 {id:"PI9371",t:"800-PI-9371",d:"Feed shoe pressure",         u:"kPa",dec:0,hi:18470,al:14500,w:0, cfg:1},
 /* present on the asset, absent from the simulator and from EFM 17 */
 {id:"JI9301",t:"800-JI-9301",d:"Drive power",                u:"MW", dec:2,hi:17.5, al:19.4, w:0, cfg:0},
 {id:"SI9302",t:"800-SI-9302",d:"Mill speed",                 u:"rpm",dec:2,hi:9.37, al:12.0, w:0, cfg:0},
 {id:"FI9385",t:"800-FI-9385",d:"High-pressure flow",         u:"L/min",dec:0,hi:720,al:480, w:0, cfg:0},
 {id:"XI9386",t:"800-XI-9386",d:"HP pumps running",           u:"of 3",dec:0,hi:3,   al:1,   w:0, cfg:0},
 {id:"TI9310",t:"800-TI-9310",d:"Stator ring",                u:"°C",dec:0,hi:61, al:80, w:0, cfg:0},
 {id:"ZI9311",t:"800-ZI-9311",d:"Drive air gap",              u:"mm", dec:2,hi:16.0, al:15.3, w:0, cfg:0},
 {id:"TI9312",t:"800-TI-9312",d:"Converter room",             u:"°C",dec:0,hi:34, al:50, w:0, cfg:0}
];
var TM={}; TAGS.forEach(function(t){TM[t.id]=t;});
var WSUM=TAGS.reduce(function(a,t){return a+(t.cfg?t.w:0);},0);
var SIMSET={ZI9376:1,TI9375:1,AI9383:1,PI9374:1,PI9380:1,PI9384:1,ZI9373:1,LI9382:1,TI9372:1,TI9381:1,PI9371:1};

/* ══════════ 3. SIMULATOR REPLAY ══════════ */
/* 258 tags at 1 min, 8065 samples = 5 d 14 h 25 min, then the sequence restarts. */
var CYC=8065;
function nz(i,k){var x=Math.sin(i*12.9898+k*78.233)*43758.5453; return (x-Math.floor(x))*2-1;}
function ramp(u,a,b,e){ if(u<=a)return 0; if(u>=b)return 1; return Math.pow((u-a)/(b-a),e); }
/* trajectories fitted to the start / mid / end values of the simulator file */
function replay(i){
  var u=i/CYC, o={};
  o.PI9384 =  62 + 120*Math.pow(u,1.55)      + 3.2*nz(i,1);
  o.LI9382 =  76 -  41*Math.pow(u,1.20)      + 1.1*nz(i,2);
  o.PI9380 = 575 - 165*Math.pow(u,1.30)      + 7.5*nz(i,3);
  o.AI9383 =  16 +   6*Math.pow(u,1.45)      + 0.25*nz(i,4);
  o.TI9381 =  44.0                           + 2.6*nz(i,5)+1.4*Math.sin(u*31.4);
  var rf=ramp(u,0.62,1.00,1.75);            /* film:        first to move   */
  var rp=ramp(u,0.64,1.00,1.60);            /* pressure:    follows         */
  var rt=ramp(u,0.70,1.00,1.45);            /* temperature: arrives last    */
  o.ZI9376 = 0.170 - 0.130*rf + 0.0022*nz(i,6);
  o.PI9374 = 18214 - 3630*rp  + 22*nz(i,7);
  o.TI9375 = 53.1  + 33.8*rt  + 0.35*nz(i,8);
  o.ZI9373 = 0.180            + 0.0020*nz(i,9);
  o.PI9371 = 18470            + 20*nz(i,10);
  o.TI9372 = 51.9             + 0.30*nz(i,11);
  return o;
}

/* ══════════ 4. WHAT-IF PHYSICS ══════════ */
var Mch0=Vm*DES.Jc*rhoC(DES.Jc,DES.Jb), Wdes=(G.M0+Mch0)*9.81/1000, pRef=Wdes*0.52/Aj;
function physics(S){
  var o={}, rc=rhoC(S.Jc,S.Jb);
  o.N=S.phi*Nc; o.Mch=Vm*S.Jc*rc; o.W=(G.M0+o.Mch)*9.81/1000;
  o.Pcap=S.cc?G.Pnom:G.Pnom*0.70;
  o.Pdem=K*austin(S.Jc,S.Jb,S.phi); o.P=Math.min(o.Pdem,o.Pcap); o.clip=o.Pdem>o.Pcap;
  o.pF=o.W*0.48/Aj; o.pD=o.W*0.52/Aj;
  var T=38+20*(1-S.cool)+11*(o.pD/pRef-1)+8*(S.phi/DES.phi-1)+(S.Tcold?-22:0);
  o.Toil=Math.max(12,Math.min(85,T));
  var mu=Math.exp(-0.045*(o.Toil-40));
  o.Q=240*S.nHP; var QF=o.Q*0.5*(1+S.split), QD=o.Q*0.5*(1-S.split), Qr=360;
  function film(h0,Q,p){ return Q<=0?0: h0*Math.pow((Q/Qr)*mu*(pRef/p),1/3); }
  var hF=film(0.180,QF,o.pF), hD=film(0.170,QD,o.pD);
  var loss=Math.pow(o.P/G.Pdis,2);
  o.Tsta=S.Twin+(S.nCool>0?8*loss*(4/S.nCool):60)+25;
  o.gap=16.0+12e-6*5.55*1000*(o.Tsta-61);
  var V={};
  V.ZI9373=hF; V.ZI9376=hD;
  V.PI9371=18470*(0.60+0.40*(S.nHP/3))*(0.92+0.08*hF/0.180);
  V.PI9374=18200*(0.60+0.40*(S.nHP/3))*(0.92+0.08*hD/0.170);
  V.TI9381=o.Toil;
  V.TI9372=o.Toil+8+40*Math.max(0,(0.180/Math.max(hF,0.001))-1);
  V.TI9375=o.Toil+9+40*Math.max(0,(0.170/Math.max(hD,0.001))-1);
  V.PI9380=575-150*Math.max(0,Math.min(1,(S.dp-60)/120))-60*Math.max(0,Math.min(1,(78-S.lvl)/48)); V.PI9384=S.dp; V.LI9382=S.lvl; V.AI9383=S.iso;
  V.JI9301=o.P; V.SI9302=o.N; V.FI9385=o.Q; V.XI9386=S.nHP;
  V.TI9310=o.Tsta; V.ZI9311=o.gap; V.TI9312=S.cc?34:56;
  o.V=V; return o;
}

/* ══════════ 5. KDI, HEALTH INDEX, FPI ══════════ */
/* KDI_i : per-parameter health as the EFM reports it, 100 at the healthy reference and
           20 at the alarm value, up to 110 when better than reference.
   HI    : asset health index, 0-100, weighted mean of the configured KDIs, with the four
           bands of the Genix gauge: 0-20, 20-50, 50-85, 85-100.
   FPI   : failure probability of the failure mode, 0-100, higher is worse. Transparent
           proxy 100-HI; the deployed model derives its own from the clustering.          */
function devOf(t,v){ if(v==null) return null; return (v-t.hi)/(t.al-t.hi); }
function kdiOf(x){ if(x==null) return null;
  if(x<0) return Math.min(110,100-18*x);
  return Math.max(0,Math.min(110,100-80*Math.min(x,1)-30*Math.max(0,x-1))); }
function bandHI(h){ return h>=85?0:(h>=50?1:(h>=20?2:3)); }
function bandOf(k){ return k==null?-1:(k>=85?0:(k>=20?1:2)); }
var HIC=["#35C08A","#F2B33D","#E07B2E","#FF4D57"];
var HIN=["Healthy","Fair","Degraded","Critical"];

/* first minute of the cycle at which each configured tag reaches its alarm */
var ALARM_AT={};
TAGS.forEach(function(t){
  if(!t.cfg||!SIMSET[t.id]) return;
  ALARM_AT[t.id]=null;
  for(var i=0;i<CYC;i+=5){ if(devOf(t,replay(i)[t.id])>=1){ ALARM_AT[t.id]=i; break; } }
});
function leadTime(i0){
  var best=null, past=null;
  for(var id in ALARM_AT){
    var a=ALARM_AT[id]; if(a===null) continue;
    if(a<=i0){ if(!past) past=id; continue; }
    var h=(a-i0)/60; if(!best||h<best.h) best={h:h,id:id};
  }
  return best?best:(past?{h:0,id:past,past:true}:null);
}

/* ══════════ 6. DRAWING ══════════ */
var svg=document.getElementById("pid");
var EQ="#4A6271", LB="#8FA6B2", DIM="#33495699";
function at(o){var s="";for(var k in o)s+=" "+k+'="'+o[k]+'"';return s;}
function L(x1,y1,x2,y2,o){return "<line"+at(Object.assign({x1:x1,y1:y1,x2:x2,y2:y2,stroke:EQ,"stroke-width":1.2},o||{}))+"/>";}
function P(d,o){return "<path"+at(Object.assign({d:d,fill:"none",stroke:EQ,"stroke-width":1.2},o||{}))+"/>";}
function R(x,y,w,h,o){return "<rect"+at(Object.assign({x:x,y:y,width:w,height:h,fill:"none",stroke:EQ,"stroke-width":1.2},o||{}))+"/>";}
function C(x,y,r,o){return "<circle"+at(Object.assign({cx:x,cy:y,r:r,fill:"none",stroke:EQ,"stroke-width":1.2},o||{}))+"/>";}
function T(x,y,s,o){return "<text"+at(Object.assign({x:x,y:y,"font-size":10,fill:LB},o||{}))+">"+s+"</text>";}
function TL(x,y,s,o){return T(x,y,s,Object.assign({class:"lbl","font-size":10.3,fill:LB},o||{}));}

function bub(x,y,id){
  var t=TM[id], p=t.t.split("-"), le=p[1], nu=p[2], sim=!!SIMSET[id];
  var s=C(x,y,17,{id:id+"_c","stroke-dasharray":t.cfg?"":"4 3",fill:"#0E171C"})
   +T(x,y-3,le,{"text-anchor":"middle","font-size":9.5,"font-weight":"700",id:id+"_t",fill:"#D7E3E9"})
   +T(x,y+9,nu,{"text-anchor":"middle","font-size":8.5,fill:"#6E8794"})
   +R(x-48,y+20,96,19,{fill:"#0A1114",stroke:"#2A3B46","stroke-width":.9,id:id+"_r"})
   +T(x-44,y+33,"—",{"font-size":10.2,"font-weight":"700",id:id+"_v",fill:"#D7E3E9"});
  if(sim) s+='<polyline id="'+id+'_s" fill="none" stroke="#5E7683" stroke-width="1.1" points=""/>';
  if(t.cfg&&t.w>0) s+=T(x+21,y-11,"w"+t.w,{"font-size":8,fill:"#55707E","font-weight":"700"});
  if(t.cfg) s+=T(x+21,y+10,"KDI —",{"font-size":8,fill:"#55707E","font-weight":"700",id:id+"_k"});
  return s;
}

var d='<defs>'
 +'<pattern id="hx" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
 +'<line x1="0" y1="0" x2="0" y2="7" stroke="#2E4552" stroke-width="1.1"/></pattern>'
 +'<pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse">'
 +'<path d="M0 0H6M0 0V6" stroke="#2E4552" stroke-width=".8"/></pattern>'
 +'<marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">'
 +'<path d="M0 0L7 3.5L0 7z" fill="#5E7683"/></marker>'
 +'<linearGradient id="gSt" x1="0" y1="0" x2="0" y2="1">'
  +'<stop offset="0" stop-color="#47606F"/><stop offset=".16" stop-color="#9DBACB"/>'
  +'<stop offset=".40" stop-color="#5A7686"/><stop offset=".74" stop-color="#2B424F"/>'
  +'<stop offset="1" stop-color="#16242C"/></linearGradient>'
 +'<linearGradient id="gHd" x1="0" y1="0" x2="0" y2="1">'
  +'<stop offset="0" stop-color="#3E5665"/><stop offset=".18" stop-color="#86A2B2"/>'

var COL={"-1":"#3E525C",0:"#5E7683",1:"#F2B33D",2:"#FF4D57"};
var VC={"-1":"#55707E",0:"#D7E3E9",1:"#F2B33D",2:"#FF4D57"};

function setB(id,txt,st){
  var c=document.getElementById(id+"_c"), v=document.getElementById(id+"_v"),
      t=document.getElementById(id+"_t"), r=document.getElementById(id+"_r");
  if(!c) return;
  v.textContent=txt; v.setAttribute("fill",VC[st]);
  c.setAttribute("stroke",COL[st]); c.setAttribute("stroke-width",st>0?1.9:1.2);
  t.setAttribute("fill",st>0?COL[st]:"#D7E3E9");
  r.setAttribute("stroke",st>0?COL[st]:"#2A3B46");
}
function pipe(id,st,on){
  var e=document.getElementById(id); if(!e) return;
  var w=e.getAttribute("data-w"); if(!w){ w=e.getAttribute("stroke-width")||"1.2"; e.setAttribute("data-w",w); }
  if(st>0) e.setAttribute("stroke",COL[st]);
  else if(e.getAttribute("data-c")) e.setAttribute("stroke",e.getAttribute("data-c"));
  if(!e.getAttribute("data-c")) e.setAttribute("data-c", e.getAttribute("stroke"));
  e.setAttribute("stroke-width", st>0?Math.max(2,parseFloat(w)):parseFloat(w));
  var cl=(e.getAttribute("class")||"").replace(" stop","").replace("stop","");
  e.setAttribute("class", on===false ? (cl+" stop").trim() : cl);
}
function spark(id,vals,hi,al){
  var el=document.getElementById(id+"_s"); if(!el) return;
  if(!vals){ el.setAttribute("points",""); return; }
  var lo=Math.min(hi,al), up=Math.max(hi,al), sp=(up-lo)||1;
  var x0=0, pts=[];
  var bb=document.getElementById(id+"_r");
  var rx=parseFloat(bb.getAttribute("x")), ry=parseFloat(bb.getAttribute("y"));
  for(var i=0;i<vals.length;i++){
    var u=Math.max(0,Math.min(1,(vals[i]-lo)/sp));
    pts.push((rx+48+i*(44/(vals.length-1))).toFixed(1)+","+(ry+15-u*11).toFixed(1));
  }
  el.setAttribute("points",pts.join(" "));
  var lastv=vals[vals.length-1];
  var dv=(lastv-hi)/(al-hi);
  el.setAttribute("stroke", dv>1?"#FF4D57":dv>0.45?"#F2B33D":"#5E7683");
}

function render(){
  SLID.forEach(function(sl){
    document.getElementById("s_"+sl.k).value=S[sl.k];
    var nb=document.getElementById("n_"+sl.k);
    if(nb && document.activeElement!==nb) nb.value=(S[sl.k]*sl.sc).toFixed(sl.dec);
  });
  var bc=document.getElementById("s_cc"); bc.textContent=S.cc?"IN SERVICE":"OUT OF SERVICE";
  bc.style.color=S.cc?"#E6EEF2":"#FF4D57"; bc.style.borderColor=S.cc?"#2A3B46":"#FF4D57";
  document.getElementById("s_Tcold").textContent=S.Tcold?"YES":"NO";

  var V={}, hist={}, live=(MODE==="live"), ph=null;
  if(live){
    var i0=Math.round(tmin);
    V=replay(i0);
    TAGS.forEach(function(t){ if(!SIMSET[t.id]) V[t.id]=null; });
    var N=16, step=42;
    TAGS.forEach(function(t){
      if(!SIMSET[t.id]) return;
      var a=[];
      for(var k=N-1;k>=0;k--){ var ii=(i0-k*step+CYC)%CYC; a.push(replay(ii)[t.id]); }
      hist[t.id]=a;
    });
  } else {
    ph=physics(S); V=ph.V;
  }

  var KD={}, num=0;
  TAGS.forEach(function(t){
    var v=V[t.id];
    KD[t.id]= v==null ? null : kdiOf(devOf(t,v));
    var txt = v==null ? "no data" : (t.dec?v.toFixed(t.dec):Math.round(v).toLocaleString("en-US"))+" "+t.u;
    setB(t.id, txt, bandOf(KD[t.id]));
    var kel=document.getElementById(t.id+"_k");
    if(kel){ kel.textContent = KD[t.id]==null ? "KDI \u2014" : "KDI "+KD[t.id].toFixed(0);
             kel.setAttribute("fill", KD[t.id]==null?"#455D69":VC[bandOf(KD[t.id])]); }
    spark(t.id, hist[t.id]||null, t.hi, t.al);
    if(t.cfg && KD[t.id]!=null) num+=t.w*KD[t.id];
  });
  var HI=Math.max(0,Math.min(100, WSUM?num/WSUM:100)), hb=bandHI(HI), FPI=100-HI;

  var flowOK = live ? true : S.nHP>0;
  ["hdr0","hdr1","hdr2"].forEach(function(id){ pipe(id, bandOf(KD.PI9380), flowOK); });
  [0,1,2,3].forEach(function(k){
    pipe("pF"+k, bandOf(KD.ZI9373), flowOK); pipe("pD"+k, bandOf(KD.ZI9376), flowOK);
    var run = live ? k<3 : k<S.nHP, res = live ? k===3 : (k===3&&S.nHP===3);
    var c=document.getElementById("hp"+k);
    if(c){ c.setAttribute("stroke", run?"#E8A33C":(res?"#55707E":"#FF4D57"));
           c.setAttribute("stroke-dasharray", res?"4 3":""); }
    var f=document.getElementById("hpf"+k);
    if(f) f.setAttribute("fill", run?"#E8A33C":(res?"#2A3B46":"#3A1316"));
    var nC = live ? 4 : S.nCool;
    pipe("cwB"+k, live?-1:bandOf(KD.TI9310), k<nC);
  });
  pipe("ring", live?-1:bandOf(KD.TI9310));
  pipe("cwCC", live?-1:(S.cc?0:2), live?true:S.cc);
  pipe("trF",bandOf(KD.ZI9373)); pipe("trD",bandOf(KD.ZI9376));
  pipe("tank",bandOf(KD.LI9382)); pipe("ccroom", live?-1:bandOf(KD.TI9312));
  var lv=V.LI9382, yy=610-0.9*(lv==null?78:lv);
  var ol=document.getElementById("oilLvl"), ob=document.getElementById("oilBody");
  if(ol){ ol.setAttribute("y1",yy); ol.setAttribute("y2",yy);
          ol.setAttribute("stroke", bandOf(KD.LI9382)>0?COL[bandOf(KD.LI9382)]:"#E8A33C"); }
  if(ob){ ob.setAttribute("y",yy+1); ob.setAttribute("height",Math.max(0,609-yy)); }

  var lt = live ? leadTime(Math.round(tmin)) : null;
  var ltv = lt ? (lt.past ? "0" : (lt.h<48 ? lt.h.toFixed(1) : String(Math.round(lt.h)))) : "\u2014";
  var lts = lt ? (lt.past ? "alarm reached" : TM[lt.id].t) : (live?"no alarm in cycle":"what-if");
  var ltb = (lt&&!lt.past) ? (lt.h<24?2:(lt.h<72?1:0)) : (lt?2:0);
  var KP=[["HEALTH INDEX",HI.toFixed(0),"/100",hb],
          ["FPI \u00B7 BEARING LUBRICATION",FPI.toFixed(0),"/100",hb],
          ["LEAD TIME",ltv,"h \u00B7 "+lts,ltb],
          ["FILM DISCHARGE",V.ZI9376==null?"\u2014":V.ZI9376.toFixed(3),"mm",bandOf(KD.ZI9376)],
          ["SHOE PRESSURE",V.PI9374==null?"\u2014":Math.round(V.PI9374).toLocaleString("en-US"),"kPa",bandOf(KD.PI9374)],
          ["SHOE TEMP",V.TI9375==null?"\u2014":V.TI9375.toFixed(1),"\u00B0C",bandOf(KD.TI9375)],
          ["OIL CLEANLINESS",V.AI9383==null?"\u2014":V.AI9383.toFixed(1),"code",bandOf(KD.AI9383)],
          ["RESERVOIR",V.LI9382==null?"\u2014":Math.round(V.LI9382),"%",bandOf(KD.LI9382)]];
  kpis.innerHTML=KP.map(function(k,i){
    var cls=(i<2)?"":(k[3]===1?"w":k[3]===2?"a":"");
    var st=(i<2)?' style="color:'+HIC[hb]+'"'
          :(i===2&&k[3]>0?' style="color:'+(k[3]===2?"#FF4D57":"#F2B33D")+'"':"");
    return '<div class="kpi '+cls+(i===0?" hero":"")+'">'
      +'<div class="k">'+k[0]+'</div><div class="v"'+st+'>'+k[1]
      +' <span class="u">'+k[2]+'</span></div></div>';}).join("");

  var ev=[];
  function pick(id,rank,msg){ if(bandOf(KD[id])>0) ev.push([rank,"<b>"+TM[id].t+"</b>"+(TM[id].w?" (w"+TM[id].w+")":"")+" — "+msg]); }
  if(!live && S.nHP<3) ev.push([1,"<b>800-XI-9386</b> — "+S.nHP+" of 3 HP pumps running. This is the cause, not the symptom."]);
  if(!live && Math.abs(S.split)>0.1) ev.push([1,"<b>Flow divider</b> off balance by "+(S.split*100).toFixed(0)+" %: one trunnion gets more flow than the other."]);
  pick("PI9380",1,"supply at "+Math.round(V.PI9380)+" kPa against a 560 kPa healthy value.");
  pick("LI9382",1,"reservoir at "+Math.round(V.LI9382)+" %, alarm at 30 %.");
  pick("PI9384",2,"filter ΔP "+Math.round(V.PI9384)+" kPa, alarm at 180 kPa.");
  pick("AI9383",2,"ISO code "+V.AI9383.toFixed(1)+", alarm at 23.");
  pick("ZI9376",2,"discharge film "+V.ZI9376.toFixed(3)+" mm. It moves first.");
  pick("ZI9373",2,"feed film "+V.ZI9373.toFixed(3)+" mm.");
  pick("PI9374",3,"discharge shoe pressure "+Math.round(V.PI9374)+" kPa. Load sharing follows the film.");
  pick("PI9371",3,"feed shoe pressure "+Math.round(V.PI9371)+" kPa.");
  pick("TI9381",4,"oil at "+V.TI9381.toFixed(1)+" °C.");
  pick("TI9375",4,"discharge shoe "+V.TI9375.toFixed(1)+" °C. It arrives last: by the time you see it, the film has already dropped.");
  pick("TI9372",4,"feed shoe "+V.TI9372.toFixed(1)+" °C.");
  if(!live){
    pick("TI9310",5,"stator ring "+Math.round(V.TI9310)+" °C with "+S.nCool+" of 4 branches. Not in the EFM.");
    pick("ZI9311",5,"air gap "+V.ZI9311.toFixed(2)+" mm. Not in the EFM.");
    if(!S.cc) ev.push([6,"<b>Converter without cooling</b>: available power limited to "+ph.Pcap.toFixed(1)+" MW."]);
    if(ph.clip) ev.push([6,"<b>Demand clipped</b>: the mill asks for "+ph.Pdem.toFixed(2)+" MW and "+ph.Pcap.toFixed(1)+" MW are available."]);
  }
  ev.sort(function(a,b){return a[0]-b[0];});
  seq.innerHTML='<div class="fpiline">Health index <b style="color:'+HIC[hb]+'">'+HI.toFixed(0)
    +'</b>/100 \u2014 '+HIN[hb]+' &nbsp;\u00B7&nbsp; FPI '+FPI.toFixed(0)
    +(live?' &nbsp;\u00B7&nbsp; replay':' &nbsp;\u00B7&nbsp; what-if')+'</div>'
    +(ev.length?"<ol>"+ev.map(function(e){return "<li>"+e[1]+"</li>";}).join("")+"</ol>"
               :'<div class="none">All EFM variables within band.</div>');

  var dd=Math.floor(tmin/1440), hh=Math.floor((tmin%1440)/60), mm=Math.floor(tmin%60);
  clk.innerHTML = live
    ? "DAY "+dd+" "+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")
      +" <small>of 5 d 14 h cycle</small>"
    : "<small>what-if, clock held</small>";
}

document.getElementById("note").innerHTML =
 '<b>Health index</b> is the weighted mean of the KDIs of the eleven parameters configured in EFM 17, on a 0\u2013100 scale '
 +'with the four bands of the Genix gauge (0\u201320, 20\u201350, 50\u201385, 85\u2013100). KDI = 100 at the healthy reference of each tag and 20 at its alarm value, '
 +'weighted as the model weights them (\u03A3w = '+WSUM+'). The <b>FPI</b> beside it is a transparent proxy, 100 \u2212 HI; the deployed model derives its own FPI '
 +'from the clustering, so the two track each other rather than matching digit for digit. <b>Lead time</b> is the time from the current position of the cycle '
 +'until the first configured tag reaches its alarm value. '
 +'<b>Live replay</b> drives the eleven tags from the plant simulator sequence \u2014 258 tags at one minute, 8 065 samples (5 d 14 h 25 min) that restart at the end of the cycle. '
 +'Start, mid and end values come from the simulator file; the shape between them is an interpolation, and the discharge-bearing collapse is given a deliberate order \u2014 '
 +'film first, shoe pressure next, temperature last \u2014 because thermal inertia lags. Tags with a dashed outline exist on the asset but are in neither the EFM nor the simulator. '
 +'<b>What-if</b> uses the Austin correlation for power, K calibrated to 17.50 MW at J = 26 %, balls 14 %, 73.3 % N<sub>c</sub>, and a hydrostatic film h \u221D (Q\u00B7\u03BC/p)<sup>1/3</sup> '
 +'referred to 0.170 mm at design. <b>To confirm:</b> number and area of shoes, and the flow and pressure of the high-pressure unit. '
 +'<b>Not modelled:</b> internal classification, pebble crushing, liner wear, start-up dynamics or the real drive protection.';

setMode("live"); mark(-1); render(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
